{% extends "base.html" %}

{% block titulo %}Publicar anúncio · Imobiliária P1{% endblock %}

{% block conteudo %}
<section class="secao container">
    <div class="formulario">
        <h1>Formulário de Anúncio</h1>
        <p class="formulario__intro">Preencha os dados do imóvel. Todos os campos são obrigatórios.</p>

        <form action="/enviar_dados" method="POST" enctype="multipart/form-data">
            <fieldset class="formulario__grupo">
                <legend>Informações do anúncio</legend>

                <div class="campo campo--inteiro">
                    <label for="titulo">Título do anúncio</label>
                    <input type="text" id="titulo" name="anuncio_titulo"
                        placeholder="Ex.: Apartamento com vista para o mar" required>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo do imóvel</label>
                    <select id="tipo" name="imovel_tipo" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Apartamento">Apartamento</option>
                        <option value="Casa">Casa</option>
                        <option value="Cobertura">Cobertura</option>
                        <option value="Studio">Studio</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="anuncio_preco" step="0.01" min="0"
                        placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="quartos">Quartos</label>
                    <input type="number" id="quartos" name="imovel_quartos" min="0" required>
                </div>

                <div class="campo">
                    <label for="banheiros">Banheiros</label>
                    <input type="number" id="banheiros" name="imovel_banheiros" min="0" required>
                </div>

                <div class="campo">
                    <label for="area">Área (m²)</label>
                    <input type="number" id="area" name="imovel_area" min="1" required>
                </div>

                <div class="campo campo--inteiro">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="anuncio_descricao" rows="6"
                        placeholder="Descreva o imóvel" required></textarea>
                </div>

                <div class="campo campo--inteiro">
                    <label for="fotos">Fotos do anúncio</label>
                    <input type="file" id="fotos" name="usuario_fotos" accept="image/*" multiple required>
                </div>
            </fieldset>

            <fieldset class="formulario__grupo">
                <legend>Endereço</legend>

                <div class="campo campo--inteiro">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="imovel_rua" placeholder="Digite a rua do imóvel" required>
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="imovel_bairro" placeholder="Digite o bairro" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="imovel_cidade" placeholder="Digite a cidade" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="imovel_estado" placeholder="Ex.: PE" required>
                </div>

                <div class="campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="imovel_cep" placeholder="00000-000" maxlength="9" required>
                </div>
            </fieldset>

            <fieldset class="formulario__grupo">
                <legend>Contato do anunciante</legend>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="usuario_email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="contato">Telefone / WhatsApp</label>
                    <input type="tel" id="contato" name="usuario_contato" placeholder="(00) 00000-0000"
                        maxlength="15" required>
                </div>
            </fieldset>

            <button class="botao botao--primario botao--grande formulario__enviar" type="submit">Publicar anúncio</button>
        </form>
    </div>
</section>
{% endblock %}
